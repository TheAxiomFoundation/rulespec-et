name: Repository Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    uses: TheAxiomFoundation/.github/.github/workflows/validate-rulespec.yml@12694e1b3dc9336cb160a38f23d98299abee4051
    secrets: inherit
    with:
      axiom-encode-ref: 5c8e16891b39d400269ebd49d0ad3f88f77e9ec1
      axiom-rules-engine-ref: 32bc1c124724ebbb2187a196a3b228cfb2a14721
      axiom-corpus-ref: a7abe870101f744f136cf8185f3824b3812bfd45
      rulespec-us-ref: 0f291b367bf7e15555f9973112278c5cbf221653
      validate-roots: auto
      run-generated-guard: true
      # Composed-pilot programs/ guarding, as piloted in rulespec-uk and
      # adopted by rulespec-gh (encode#1053).
      guard-programs-root: false
